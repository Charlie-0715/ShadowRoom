{# 使用 inline styles 动态渲染用户传入的个性化参数，保持极致的灵活性 #}
<div class="glass-backdrop {{ extra_classes }}" style="
        --glass-blur: {{ blur }}px;
        --glass-opacity: {{ opacity }};
        --glass-rounded: {{ rounded }};
        --glass-border-color: {{ border_color }};
     ">
  <!-- 内部光效边缘：提供上方微亮、下方稍暗的立体边缘高光，模拟玻璃厚度 -->
  <div class="glass-border-highlight"></div>

  <!-- 组件的内容容器槽 (Slot / Child Content) -->
  <div class="glass-content">{{ slot }}</div>
</div>
