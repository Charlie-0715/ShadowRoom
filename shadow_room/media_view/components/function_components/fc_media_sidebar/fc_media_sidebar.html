<aside class="sidebar">
  <h3 class="sidebar-title">
    {{media_type}}分类
  </h3>
  <ul class="genre-list">
    <li>
      <a href="{% url media_list %}" class="{% if not current_genre %}active{% endif %}">全部 <span class="genre-count">{{
          media_total }}</span></a>
    </li>
    {% for g in genre_counts %}
    <li>
      <a href="{% url media_list %}?genre={{ g.name }}" class="{% if current_genre == g.name %}active{% endif %}">
        {{ g.name }}{% if g.count > 0 %}
        <span class="genre-count">{{ g.count }}</span>
        {% endif %}
      </a>
    </li>
    {% endfor %}
  </ul>
</aside>
